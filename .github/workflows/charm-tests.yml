name: Charm Tests (no charmcraft)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  charm-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run charm static tests
        run: |
          uv sync --group dev
          uv run tox -e format
          uv run tox -e lint
          uv run tox -e static
          uv run tox -e unit
